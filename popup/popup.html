<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConScan - Confluence Scanner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="6" fill="#0052CC"/>
            <path d="M7 12C7 9.23858 9.23858 7 12 7C14.7614 7 17 9.23858 17 12V14.5C17 15.8807 15.8807 17 14.5 17C13.1193 17 12 15.8807 12 14.5V11C12 10.4477 11.5523 10 11 10C10.4477 10 10 10.4477 10 11V14.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1 class="title">ConScan</h1>
          <p class="subtitle">Confluence Attachment Scanner</p>
        </div>
      </div>
      <span class="version-tag">v1.0</span>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- Status Card -->
      <div class="status-card" id="statusCard">
        <div class="status-indicator" id="statusDot"></div>
        <div class="status-details">
          <div class="status-title" id="statusTitle">Đang kiểm tra tab...</div>
          <div class="status-sub" id="statusSub">Đang tìm kết nối Confluence...</div>
        </div>
      </div>

      <!-- Tab Selector (if multiple Confluence tabs found) -->
      <div class="form-group hidden" id="tabSelectGroup">
        <label for="tabSelect" class="form-label">Chọn tab Confluence:</label>
        <select id="tabSelect" class="form-select"></select>
      </div>

      <!-- Quick Actions -->
      <div class="actions">
        <button id="btnOpenDashboard" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          Mở ConScan Dashboard
        </button>

        <button id="btnQuickScan" class="btn btn-secondary" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="10 8 16 12 10 16 10 8"/>
          </svg>
          Quét nhanh Tab này
        </button>
      </div>

      <!-- Instructions / Tip -->
      <div class="tip-box">
        <div class="tip-icon">💡</div>
        <div class="tip-text" id="tipText">
          Hãy mở một tab Confluence mà bạn đã đăng nhập để quét mọi tệp đính kèm mà bạn có quyền truy cập.
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Tự động nhận diện quyền truy cập Confluence</span>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
